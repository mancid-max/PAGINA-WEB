<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dolce Vita · Primavera-Verano 2026 — Mohicano Jeans</title>
<meta property="og:title" content="Dolce Vita · Primavera-Verano 2026 — Mohicano Jeans">
<meta property="og:description" content="Catálogo exclusivo para mayoristas · 62 modelos en 14 líneas.">
<meta property="og:image" content="https://mohicanojeans.netlify.app/catalogo-44/img/og-dv44.jpg">
<meta property="og:url" content="https://mohicanojeans.netlify.app/catalogo-44/entrada.html">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#0a1a28 0%,#1a3a55 50%,#0a1a28 100%);
    font-family:'Segoe UI',Arial,sans-serif;padding:1.5rem;
  }

  .banner{
    position:relative;width:100%;max-width:780px;
    background:linear-gradient(160deg,#12283A 0%,#1a3a55 60%,#0e2030 100%);
    border-radius:20px;overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 1px rgba(200,153,42,.25);
    cursor:pointer;transition:transform .3s ease,box-shadow .3s ease;
    text-decoration:none;display:block;
  }
  .banner:hover{
    transform:translateY(-4px) scale(1.01);
    box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 0 1.5px rgba(200,153,42,.5);
  }

  /* ── Cierre dorado ── */
  .zipper{
    height:28px;
    background:linear-gradient(180deg,#e8c84a 0%,#c8992a 40%,#a07020 60%,#c8992a 80%,#e8c84a 100%);
    position:relative;display:flex;align-items:center;
  }
  .zipper::before{
    content:'';position:absolute;inset:0;
    background:repeating-linear-gradient(90deg,
      transparent 0px,transparent 10px,
      rgba(0,0,0,.18) 10px,rgba(0,0,0,.18) 11px
    );
  }
  .zipper-pull{
    position:absolute;left:50%;transform:translateX(-50%);
    width:22px;height:34px;z-index:2;
    background:linear-gradient(180deg,#f5e070,#c8992a,#a07020);
    border-radius:4px 4px 8px 8px;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
    display:flex;align-items:center;justify-content:center;
    font-size:9px;font-weight:900;color:#6b4700;letter-spacing:0;
  }
  .zipper-pull::after{
    content:'';position:absolute;bottom:-8px;
    width:10px;height:10px;border-radius:50%;
    background:linear-gradient(135deg,#f5e070,#a07020);
    box-shadow:0 1px 3px rgba(0,0,0,.4);
  }

  /* ── Contenido ── */
  .body{padding:1.6rem 2rem 1.4rem;position:relative}

  /* remaches */
  .rivet{
    position:absolute;width:24px;height:24px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#f5e070,#c8992a 50%,#7a5010);
    box-shadow:0 2px 6px rgba(0,0,0,.5),inset 0 1px 2px rgba(255,255,200,.4);
    display:flex;align-items:center;justify-content:center;
    font-size:9px;font-weight:900;color:#6b4700;
  }
  .rivet.tl{top:1rem;left:1rem}
  .rivet.tr{top:1rem;right:1rem}
  .rivet.bl{bottom:2.8rem;left:1rem}
  .rivet.br{bottom:2.8rem;right:1rem}

  /* badge stock */
  .badge-stock{
    position:absolute;top:0;right:3rem;
    background:#d81f2a;color:#fff;
    font-size:.68rem;font-weight:800;letter-spacing:.12em;
    padding:.35rem .9rem;border-radius:999px;
    display:flex;align-items:center;gap:.4rem;
    box-shadow:0 4px 14px rgba(216,31,42,.45);
  }
  .badge-dot{
    width:7px;height:7px;border-radius:50%;background:#fff;
    animation:pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}

  /* textos izquierda */
  .eyebrow{
    color:#c8992a;font-size:.72rem;font-weight:700;
    letter-spacing:.25em;text-transform:uppercase;margin-bottom:.6rem;
  }
  .titulo{
    font-family:Georgia,'Times New Roman',serif;
    font-style:italic;font-size:clamp(2.4rem,6vw,3.4rem);
    font-weight:700;color:#fff;line-height:1;margin-bottom:.5rem;
    text-shadow:0 2px 12px rgba(0,0,0,.4);
  }
  .subtitulo{
    color:rgba(255,255,255,.65);font-size:.88rem;
    display:flex;align-items:center;gap:.4rem;
  }

  /* columna derecha */
  .cols{display:flex;justify-content:space-between;align-items:center;gap:1rem}
  .col-right{display:flex;flex-direction:column;align-items:flex-end;gap:.6rem;flex-shrink:0}

  .btn-cta{
    background:linear-gradient(135deg,#f5e070,#c8992a);
    color:#3d2000;font-size:1.05rem;font-weight:800;
    padding:.75rem 1.8rem;border-radius:999px;border:none;
    box-shadow:0 6px 20px rgba(200,153,42,.5);
    white-space:nowrap;cursor:pointer;
    animation:glow 2.5s ease-in-out infinite;
    transition:transform .2s;
  }
  .btn-cta:hover{transform:scale(1.05)}
  @keyframes glow{
    0%,100%{box-shadow:0 6px 20px rgba(200,153,42,.5)}
    50%{box-shadow:0 6px 30px rgba(200,153,42,.85),0 0 40px rgba(200,153,42,.3)}
  }

  .urgencia{color:#e8734a;font-size:.75rem;font-weight:600;text-align:right}
  .urgencia::before{content:'• '}

  /* pie */
  .pie{
    margin-top:1.2rem;
    color:rgba(255,255,255,.45);font-size:.7rem;
    font-weight:700;letter-spacing:.2em;text-transform:uppercase;
    display:flex;gap:1.2rem;
  }
  .pie span{white-space:nowrap}

  /* bandera italiana */
  .flag-bar{height:5px;display:flex;width:100%}
  .flag-bar i{flex:1}
  .flag-bar i:nth-child(1){background:#009246}
  .flag-bar i:nth-child(2){background:#fff}
  .flag-bar i:nth-child(3){background:#ce2b37}

  /* mobile */
  @media(max-width:520px){
    .body{padding:1.2rem 1.4rem 1.2rem}
    .cols{flex-direction:column;align-items:flex-start}
    .col-right{align-items:flex-start}
    .badge-stock{right:1.2rem}
    .urgencia{text-align:left}
    .pie{flex-wrap:wrap;gap:.6rem}
  }
</style>
</head>
<body>

<a class="banner" href="https://mohicanojeans.netlify.app/catalogo-44/">

  <div class="zipper">
    <div class="zipper-pull">▼</div>
  </div>

  <div class="body">
    <div class="rivet tl">M</div>
    <div class="rivet tr">M</div>
    <div class="rivet bl">M</div>
    <div class="rivet br">M</div>

    <div class="badge-stock"><span class="badge-dot"></span>STOCK LIMITADO</div>

    <div class="cols">
      <div class="col-left">
        <p class="eyebrow">Mohicano · Pedidos Mayoristas</p>
        <h1 class="titulo">Dolce Vita</h1>
        <p class="subtitulo">🇮🇹 PV 2026 · Inspirada en Italia</p>
      </div>
      <div class="col-right">
        <div class="btn-cta">Pinchar aquí →</div>
        <p class="urgencia">Quedan pocas unidades por talla</p>
      </div>
    </div>

    <div class="pie">
      <span>62 Modelos</span>
      <span>·</span>
      <span>14 Líneas</span>
      <span>·</span>
      <span>Mín. 12 u.</span>
    </div>
  </div>

  <div class="flag-bar"><i></i><i></i><i></i></div>

</a>

</body>
</html>
